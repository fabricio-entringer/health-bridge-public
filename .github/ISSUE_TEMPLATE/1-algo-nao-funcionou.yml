name: 🐞 Algo não funcionou
description: Conte o que deu errado no app
labels: ["bug", "triage: pending"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar. Não precisa de linguagem técnica — descreva com suas palavras.

        ⚠️ **Este espaço é público.** Antes de enviar print ou texto, confira se não aparece o token do seu bot, o número (chat id) dos seus canais ou dados de saúde que você não quer mostrar.

  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      placeholder: Ex.- apertei Enviar e a tela ficou em branco.
    validations:
      required: true

  - type: textarea
    id: o-que-esperava
    attributes:
      label: O que você esperava que acontecesse?
      placeholder: Ex.- que aparecesse a confirmação do envio.

  - type: textarea
    id: como-repetir
    attributes:
      label: Como chegar nesse ponto?
      description: Os passos que você fez, na ordem. Ajuda muito a encontrar o problema.
      placeholder: |
        1. Abri a aba Enviar
        2. Toquei em Enviar
        3. ...

  - type: input
    id: versao-app
    attributes:
      label: Versão do app
      description: Aparece na tela "Sobre". Se o relato saiu de dentro do app, já vem preenchida.
      placeholder: Ex.- 0.1.0

  - type: input
    id: versao-ios
    attributes:
      label: Versão do iPhone (iOS)
      description: Opcional. Está em Ajustes → Geral → Sobre.
      placeholder: Ex.- 26.5

  - type: textarea
    id: imagem
    attributes:
      label: Print ou vídeo
      description: Opcional, mas ajuda bastante em problema de tela. Arraste o arquivo para dentro deste campo.
