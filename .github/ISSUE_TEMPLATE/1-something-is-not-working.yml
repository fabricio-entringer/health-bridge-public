name: 🐞 Something isn't working
description: Tell us what went wrong in the app
labels: ["bug", "triage: pending"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. No technical language needed — describe it in your own words.

        🌍 **Write in whichever language you prefer.** You'll get an answer in the same language.

        ⚠️ **This is a public space.** Before posting text or a screenshot, check that it doesn't show your bot token, the chat id of your channels, or health data you'd rather keep private.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: e.g.- I tapped Send and the screen went blank.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g.- the send confirmation should have appeared.

  - type: textarea
    id: steps
    attributes:
      label: How do you get there?
      description: The steps you took, in order. This helps a lot in finding the problem.
      placeholder: |
        1. Opened the Send tab
        2. Tapped Send
        3. ...

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the About screen. Filled in automatically when the report is sent from inside the app.
      placeholder: e.g.- 0.1.0

  - type: input
    id: ios-version
    attributes:
      label: iPhone (iOS) version
      description: Optional. Settings → General → About.
      placeholder: e.g.- 26.5

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Optional, but very helpful for anything visual. Drag the file into this field.
