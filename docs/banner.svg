<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="HealthBridge — from Apple Health to Telegram, with one tap">
  <title>HealthBridge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.55" stop-color="#0E1E33"/>
      <stop offset="1" stop-color="#14304E"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#229ED9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#229ED9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#229ED9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF375F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="url(#glow)"/>
  <circle cx="820" cy="280" r="200" fill="url(#glow2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="68" font-weight="700" fill="#F2F6FA" letter-spacing="-1">HealthBridge</text>
    <text x="84" y="196" font-size="27" font-weight="500" fill="#93A9C0">From Apple Health to Telegram, with one tap.</text>
    <text x="84" y="244" font-size="19" font-weight="500" fill="#5C7590" letter-spacing="2">iOS · NO SERVER · YOUR DATA</text>
  </g>

  <g transform="translate(840 96)">
