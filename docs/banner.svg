    <path d="M100 210 L100 176 M170 210 L170 154 M240 210 L240 176" stroke="url(#span)" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
    <path d="M40 214 L300 214" stroke="#2C4864" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(34 128) scale(2.1)">
      <path d="M12 21s-6.7-4.4-9.3-8.1C0.6 10.1 1.5 6.2 4.6 4.9c2-0.8 4.3-0.3 5.6 1.3L12 8.3l1.8-2.1c1.3-1.6 3.6-2.1 5.6-1.3 3.1 1.3 4 5.2 1.9 8.1C18.7 16.6 12 21 12 21z" fill="#FF375F"/>
    </g>

    <g transform="translate(250 128) scale(2.1)">
      <path d="M22 3L2 11.2l6.4 2.2L19 6.4l-8.2 8.6 0.3 6L14 17.6l4.4 3.1z" fill="#229ED9"/>
